name: Android APK (fork)

# This fork's own Android build: the same steps as "Android build" (android.yml), but it runs on a push to the
# `apk` branch as well as by hand, signs with the repository's upload key when its secrets are set and otherwise
# with a key this workflow makes once and keeps in the Actions cache (so later APKs install over earlier ones),
# and attaches the APK to a draft release (visible only to the repository's owner) as well as the run's artifact.
on:
  push:
    branches: [apk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-fork-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_VARIANT: preview
      # This fork's own name and package (TRADEMARKS.md asks a public fork for both).
      APP_NAME: Baiyu Bot
      APP_PACKAGE: bot.baiyu.app
    steps:
      # Same reason as android.yml: free disk and add swap so the C++ compiles don't take the runner down.
      - name: Disk and swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 8G /extra.swap
          sudo chmod 600 /extra.swap
          sudo mkswap /extra.swap > /dev/null
          sudo swapon /extra.swap
          df -h / && free -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - run: bun install --frozen-lockfile
      # apps/mobile/RELEASE names the version this commit is (v1.2.3). A version with no release yet is published;
      # any other build stays a draft.
      - name: Version
        run: |
          echo "ANDROID_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          rel="$(tr -d '[:space:]' < apps/mobile/RELEASE 2>/dev/null || true)"
          if [[ "$rel" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_TAG=$rel" >> "$GITHUB_ENV"
            echo "APP_VERSION=${rel#v}" >> "$GITHUB_ENV"
          fi

      # The signing key: the repository's secrets when set; otherwise one kept in the Actions cache, made on the
      # first run. Neither ever enters the repo.
      - name: Restore the fork's signing key
        id: key-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.fork-signing
          key: fork-signing-key-v1
      - name: Signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ "$KEYSTORE_BASE64" != PLACEHOLDER ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the repository's upload key."
            exit 0
          fi
          dir="$HOME/.fork-signing"
          if [ ! -f "$dir/upload.keystore" ]; then
            mkdir -p "$dir"
            openssl rand -hex 24 > "$dir/password"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$dir/upload.keystore" \
              -storepass "$(cat "$dir/password")" -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=${GITHUB_REPOSITORY_OWNER} fork build"
            echo "made=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Made a new signing key for this fork and kept it in the Actions cache."
          fi
          pw="$(cat "$dir/password")"
          echo "::add-mask::$pw"
          {
            echo "ANDROID_KEYSTORE_PATH=$dir/upload.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$pw"
            echo "ANDROID_KEY_ALIAS=upload"
            echo "ANDROID_KEY_PASSWORD=$pw"
          } >> "$GITHUB_ENV"
      - name: Keep the fork's signing key
        if: steps.key.outputs.made == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.fork-signing
          key: fork-signing-key-v1

      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_BASE64" ] || [ "$GOOGLE_SERVICES_BASE64" = PLACEHOLDER ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set: this build gets no push on Android."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 -d > "$RUNNER_TEMP/google-services.json"
          if jq -e '.client[]? | select(.client_info.android_client_info.package_name == env.APP_PACKAGE)' \
            "$RUNNER_TEMP/google-services.json" > /dev/null; then
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          else
            echo "::warning::google-services.json has no app $APP_PACKAGE: this build gets no push."
          fi
      - name: Native project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --clean --no-install
      - name: Build
        working-directory: apps/mobile/android
        run: |
          ./gradlew --no-daemon --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
            "-Pkotlin.daemon.jvmargs=-Xmx2g" "-PreactNativeArchitectures=arm64-v8a" assembleRelease
      - name: Name the APK
        run: |
          apk=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          out="$RUNNER_TEMP/baiyu-bot-${RELEASE_TAG:-build${ANDROID_VERSION_CODE}}-android-arm64.apk"
          cp "$apk" "$out"
          echo "APK_PATH=$out" >> "$GITHUB_ENV"
          ls -la "$out"
          # The JS bundle's source map, so a stack a screen shows can be read back (metro-symbolicate).
          map=$(ls apps/mobile/android/app/build/generated/sourcemaps/react/release/*.map 2> /dev/null | head -1 || true)
          if [ -n "$map" ]; then
            cp "$map" "${out%.apk}.js.map"
            echo "MAP_PATH=${out%.apk}.js.map" >> "$GITHUB_ENV"
          else
            echo "::warning::no source map found"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk-${{ env.ANDROID_VERSION_CODE }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          credit="Baiyu Bot is a fork of agentes.chat. Based on agentes.chat by Codari Global, LLC (AGPL-3.0); source: https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}"
          if [ -n "${RELEASE_TAG:-}" ] && ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            { cat apps/mobile/RELEASE_NOTES.md 2> /dev/null || true; printf '\n%s\n' "$credit"; } > "$RUNNER_TEMP/notes.md"
            gh release create "$RELEASE_TAG" "$APK_PATH" ${MAP_PATH:+"$MAP_PATH"} --target "$GITHUB_SHA" \
              --title "Baiyu Bot ${RELEASE_TAG}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "android-build-${ANDROID_VERSION_CODE}" "$APK_PATH" ${MAP_PATH:+"$MAP_PATH"} --draft --target "$GITHUB_SHA" \
              --title "Android APK (build ${ANDROID_VERSION_CODE})" --notes "$credit"
          fi
      - name: Remove the key copies
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore" "$RUNNER_TEMP/google-services.json"
