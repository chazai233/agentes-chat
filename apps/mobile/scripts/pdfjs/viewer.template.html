<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">
<!--
  The app's PDF page for Android, whose WebView has no PDF viewer of its own (iOS draws PDFs natively).
  Built by scripts/pdfjs/build-viewer.mjs from pdf.js __PDFJS_VERSION__ (Mozilla, Apache License 2.0,
  https://github.com/mozilla/pdf.js); the license is kept below. The app sends the file's bytes with
  postMessage; nothing here reaches the network.
-->
<style>
  html, body { margin: 0; padding: 0; background: var(--bg, #f4f4f2); }
  body { -webkit-tap-highlight-color: transparent; }
  #pages { padding: 10px 0 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .page { position: relative; width: calc(100vw - 20px); background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .page canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #note { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 32px;
    font: 15px/1.4 system-ui, sans-serif; color: var(--muted, #888); text-align: center; }
  #note.hidden { display: none; }
</style>
</head>
<body>
<div id="note"></div>
<div id="pages"></div>
<script type="text/plain" id="pdfjs-license">__LICENSE__</script>
<script>__PDFJS__</script>
<script type="text/plain" id="pdfjs-worker">__WORKER__</script>
<script type="application/json" id="pdfjs-cmaps">__CMAPS__</script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var root = document.documentElement.style;
  if (q.get("bg")) root.setProperty("--bg", q.get("bg"));
  if (q.get("muted")) root.setProperty("--muted", q.get("muted"));
  var note = document.getElementById("note");
  var pagesEl = document.getElementById("pages");
  note.textContent = q.get("loading") || "";

  function post(msg) {
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
  }
  function fail(err) {
    note.textContent = q.get("failed") || "";
    note.classList.remove("hidden");
    post({ type: "error", message: String(err && err.message || err) });
  }

  var lib = window.pdfjsLib;
  // The worker's source rides in the page; started from a Blob URL it parses and draws off the page's thread.
  // Handed over as a port, since pdf.js won't start a worker by URL from a file:// page (its origin is "null").
  // Where workers can't start, pdf.js runs the same code on the page instead.
  var workerUrl = URL.createObjectURL(
    new Blob([document.getElementById("pdfjs-worker").textContent], { type: "text/javascript" }),
  );
  lib.GlobalWorkerOptions.workerSrc = workerUrl;
  function pdfWorker() {
    try { return new lib.PDFWorker({ port: new Worker(workerUrl) }); } catch (_) { return undefined; }
  }

  // CMaps (CJK and other encodings) from the page itself, read only when a file asks for one.
  var cmaps = null;
  function EmbeddedCMaps() {}
  EmbeddedCMaps.prototype.fetch = function (o) {
    if (!cmaps) cmaps = JSON.parse(document.getElementById("pdfjs-cmaps").textContent);
    var b64 = cmaps[o.name];
    if (!b64) return Promise.reject(new Error("no cmap " + o.name));
    return Promise.resolve({ cMapData: decode(b64), compressionType: lib.CMapCompressionType.BINARY });
  };

  function decode(b64) {
    var bin = atob(b64);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  var started = false;
  function onMessage(e) {
    var msg;
    try { msg = JSON.parse(e.data); } catch (_) { return; }
    if (!msg || msg.type !== "pdf" || started) return;
    started = true;
    open(decode(msg.data)).catch(fail);
  }
  window.addEventListener("message", onMessage);
  document.addEventListener("message", onMessage);

  // Canvases kept drawn around what's on screen; the rest are dropped so a long file stays within memory.
  var KEEP = 3;
  // Drawn sharper than the screen so a pinch zoom stays readable, under a cap on pixels per page.
  var OVERSCALE = 1.6;
  var MAX_PIXELS = 12e6;

  async function open(bytes) {
    var doc = await lib.getDocument({
      data: bytes,
      worker: pdfWorker(),
      CMapReaderFactory: EmbeddedCMaps,
      cMapUrl: "embedded/",
      cMapPacked: true,
      isEvalSupported: false,
      useSystemFonts: true,
    }).promise;
    var slots = [];
    for (var n = 1; n <= doc.numPages; n++) {
      var page = await doc.getPage(n);
      var vp = page.getViewport({ scale: 1 });
      var el = document.createElement("div");
      el.className = "page";
      el.style.aspectRatio = vp.width + " / " + vp.height;
      el.dataset.n = String(n - 1);
      pagesEl.appendChild(el);
      slots.push({ page: page, el: el, canvas: null, task: null });
      if (n === 1) note.classList.add("hidden");
    }
    post({ type: "loaded", pages: doc.numPages });

    var visible = new Set();
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var i = Number(en.target.dataset.n);
        if (en.isIntersecting) visible.add(i); else visible.delete(i);
      });
      refresh();
    }, { rootMargin: "100% 0px" });
    slots.forEach(function (s) { io.observe(s.el); });

    function refresh() {
      if (visible.size === 0) return;
      var lo = Math.min.apply(null, Array.from(visible)) - KEEP;
      var hi = Math.max.apply(null, Array.from(visible)) + KEEP;
      slots.forEach(function (s, i) {
        if (i >= lo && i <= hi) { if (visible.has(i)) draw(s); }
        else drop(s);
      });
    }

    function draw(s) {
      if (s.canvas) return;
      var cssWidth = s.el.clientWidth;
      var base = s.page.getViewport({ scale: 1 });
      var scale = (cssWidth * (window.devicePixelRatio || 1) * OVERSCALE) / base.width;
      var pixels = base.width * base.height * scale * scale;
      if (pixels > MAX_PIXELS) scale = scale * Math.sqrt(MAX_PIXELS / pixels);
      var vp = s.page.getViewport({ scale: scale });
      var canvas = document.createElement("canvas");
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      s.canvas = canvas;
      s.el.appendChild(canvas);
      s.task = s.page.render({ canvasContext: canvas.getContext("2d"), viewport: vp });
      s.task.promise.catch(function () {});
    }

    function drop(s) {
      if (!s.canvas) return;
      if (s.task) s.task.cancel();
      s.canvas.width = 0;
      s.canvas.height = 0;
      s.el.removeChild(s.canvas);
      s.canvas = null;
      s.task = null;
    }
  }

  post({ type: "ready" });
})();
</script>
</body>
</html>
