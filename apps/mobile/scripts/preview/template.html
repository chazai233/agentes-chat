<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">
<!-- Nothing leaves the phone: no network, scripts only from the page itself, pictures and fonts only from the file. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob:; media-src data: blob:">
<!--
  The app's preview page for Word, spreadsheets, CSV, PowerPoint and ZIP files. Built by
  scripts/preview/build.mjs; the licenses of what it bundles are kept below.
-->
<style>
  :root { --bg: #f4f4f2; --ink: #1d1d1b; --muted: #888; --line: #ddd; --raised: #fff; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Noto Sans CJK SC", sans-serif; }
  body { -webkit-tap-highlight-color: transparent; }
  #note { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 32px;
    font-size: 15px; color: var(--muted); text-align: center; }
  .hidden { display: none !important; }

  /* Word */
  .docx-host { padding: 10px 0 24px; }
  .docx-host .docx-wrapper { background: transparent !important; padding: 0 !important; display: flex;
    flex-direction: column; align-items: center; gap: 10px; }
  .docx-host .docx-wrapper > section.docx { margin: 0 !important; box-shadow: 0 1px 3px rgba(0,0,0,.18) !important;
    color: #000; }

  /* Spreadsheets */
  .tabs { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px;
    background: var(--bg); border-bottom: 1px solid var(--line); }
  .tab { flex: none; border: 1px solid var(--line); background: var(--raised); color: var(--ink); border-radius: 999px;
    padding: 5px 12px; font: inherit; font-size: 13px; }
  .tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .grid-wrap { overflow: auto; padding: 0 0 24px; }
  .grid { border-collapse: collapse; background: var(--raised); font-size: 13px; }
  .grid th, .grid td { border: 1px solid var(--line); padding: 4px 8px; white-space: pre; max-width: 320px;
    overflow: hidden; text-overflow: ellipsis; text-align: left; vertical-align: top; }
  .grid th { background: var(--bg); color: var(--muted); font-weight: 500; position: sticky; }
  .grid tr:first-child th { top: 0; z-index: 1; }
  .grid th:first-child { left: 0; text-align: right; }
  .grid .corner { z-index: 2 !important; }
  .cut, .empty { padding: 14px 12px; color: var(--muted); font-size: 13px; }

  /* PowerPoint */
  .slides { padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .frame { position: relative; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.18); background: #fff; }
  .slide { position: absolute; left: 0; top: 0; overflow: hidden; color: #000;
    font-family: "Calibri", "Noto Sans CJK SC", system-ui, sans-serif; }
  .pp-abs { position: absolute; }
  .pp-shape { box-sizing: border-box; }
  .pp-shape > img, .pp-abs > img { width: 100%; height: 100%; }
  img.pp-abs { object-fit: fill; }
  .pp-text { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box;
    overflow: hidden; line-height: 1.15; word-wrap: break-word; }
  .pp-text p { margin: 0; }
  .pp-table { border-collapse: collapse; width: 100%; }
  .pp-table td { border: 1px solid #999; vertical-align: top; position: relative; }
  .pp-table td .pp-text { position: static; }

  /* ZIP */
  .zip { padding: 6px 0 24px; }
  .entry { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .entry .icon { width: 12px; color: var(--muted); }
  .entry .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .entry.dir .name { font-weight: 600; }
  .entry .size { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="note"></div>
<div id="view"></div>
<script type="text/plain" id="licenses">__LICENSES__</script>
<script>__SCRIPT__</script>
</body>
</html>
